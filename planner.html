<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>주간 플래너</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f1f1f3;--paper:#fff;--ink:#23232b;--mu:#8b8b98;--rl:#cfcfd6;--gr:#e1eee4;--red:#d9534f}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#121216;--paper:#1c1c24;--ink:#ececf4;--mu:#9a9aab;--rl:#3a3a4a;--gr:#24382b;--red:#ff7b72}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121216;--paper:#1c1c24;--ink:#ececf4;--mu:#9a9aab;--rl:#3a3a4a;--gr:#24382b;--red:#ff7b72}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;padding:12px}
.sheet{max-width:1000px;margin:0 auto;background:var(--paper);border-radius:26px;padding:16px 18px 14px;box-shadow:0 6px 26px rgba(0,0,0,.1)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.ttl{font-size:15px;font-weight:600}.ttl small{color:var(--mu);font-weight:400;margin-left:8px}
.nav{display:flex;gap:6px}
.nav button{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:1px solid var(--rl);border-radius:99px;padding:4px 12px;cursor:pointer}
.lg{font-size:11px;color:var(--mu);text-align:right;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 14px}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.grid{grid-template-columns:1fr}}
.dh{position:relative;text-align:center;border-bottom:2px solid var(--ink);padding:2px 0 3px}
.doy{position:absolute;left:0;top:0;font-size:9px;color:var(--mu)}
.n{display:inline-block;min-width:26px;font-size:20px;font-weight:600;line-height:1.25;border-radius:99px;padding:0 6px}
.w{font-size:10px;line-height:1}
.red .n,.red .w{color:var(--red)}
.today .n{background:var(--ink);color:var(--paper)}
.note{display:block;width:100%;height:13px;text-align:center;font:inherit;font-size:9px;color:var(--mu);background:transparent;border:0;outline:0;padding:0;margin-top:1px}
.red .note::placeholder{color:var(--red);opacity:.8}
.row{display:grid;grid-template-columns:22px 24px 1fr;height:29px;border-bottom:1px solid var(--rl)}
.row>*{border:0;border-right:1px solid var(--rl);background:transparent;color:var(--ink);font-family:"Gaegu","Nanum Pen Script",cursive;outline:0;min-width:0;padding:0}
.row>*:last-child{border-right:0}
.st{font-size:15px;cursor:pointer;font-family:system-ui,sans-serif}
.lt{text-align:center;font-size:15px;color:var(--mu)}
.tx{font-size:18px;padding:0 6px}
.row.d .st,.row.d .lt{background:var(--gr)}
.row.x .tx{text-decoration:line-through;color:var(--mu)}
.row.m .tx{color:var(--mu)}
.day{margin-bottom:10px}
.gh{text-align:center;font-size:20px;font-weight:600;border-bottom:2px solid var(--ink);padding:2px 0 5px}
.gr{display:grid;grid-template-columns:62px 1fr;height:29px;border-bottom:1px solid var(--rl);align-items:center}
.gr span{font-size:11px;color:var(--mu)}
.gr input{width:100%;height:100%;border:0;background:transparent;outline:0;color:var(--ink);font-family:"Gaegu",cursive;font-size:18px;padding:0 4px}
.cal{margin-top:14px;font-size:10px}
.cal b{font-size:11px;font-weight:600}
.cal table{border-collapse:collapse;width:100%;margin-top:3px;text-align:center}
.cal td,.cal th{padding:1px 0;font-weight:400;color:var(--ink)}
.cal .we{color:var(--red)}.cal .in{background:var(--gr);font-weight:600}
button:focus-visible,input:focus-visible{outline:2px solid #5b5bd6;outline-offset:1px}
</style>
</head>
<body>
<div class="sheet" id="app"></div>
<script>
(function(){
var R=10,KEY='weekly-planner-v1',mem=null;
var DN=['월','화','수','목','금','토','일'],MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var HOL={'1-1':'신정','3-1':'삼일절','5-5':'어린이날','6-6':'현충일','8-15':'광복절','10-3':'개천절','10-9':'한글날','12-25':'성탄절'};
var GL=['자기관리','체력단련','대인관계','자기계발','자아실현','역할 1','역할 2','역할 3'];
var ST=['','d','m','x','g','p'],GLY={d:'✓',m:'→',x:'✕',g:'☑',p:'●'};
function p2(n){return n<10?'0'+n:''+n}
function key(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function add(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x}
function mon(d){return add(d,-((d.getDay()+6)%7))}
function doy(d){return Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(d.getFullYear(),0,1))/864e5)+1}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var DB;try{DB=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){DB={}}
function save(){var j=JSON.stringify(DB);mem=j;try{localStorage.setItem(KEY,j)}catch(e){}}
function wk(k){if(!DB[k]){var r=[];for(var i=0;i<7;i++){var a=[];for(var j=0;j<R;j++)a.push({s:'',l:String.fromCharCode(65+j),t:''});r.push(a)}DB[k]={r:r,n:['','','','','','',''],g:['','','','','','','','']}}return DB[k]}
var ws=mon(new Date()),app=document.getElementById('app');
function render(){
 var k=key(ws),W=wk(k),we=add(ws,6),th=add(ws,3),tk=key(new Date()),h='';
 var a=ws.getFullYear()+' '+MON[ws.getMonth()]+'.',b=we.getFullYear()+' '+MON[we.getMonth()]+'.';
 h+='<div class="bar"><div class="ttl">'+(a===b?a:a+'~'+b)+'<small>Week '+Math.ceil(doy(th)/7)+'</small></div><div class="nav"><button data-nav="-1">◀ 이전 주</button><button data-nav="0">오늘</button><button data-nav="1">다음 주 ▶</button></div></div>';
 h+='<div class="lg">✓ 완료 &nbsp;→ 연기 &nbsp;✕ 취소 &nbsp;☑ 위임 &nbsp;● 진행 중 &nbsp;<span style="opacity:.7">(칸을 누르면 바뀌어요)</span></div><div class="grid">';
 for(var i=0;i<7;i++){var d=add(ws,i),hol=HOL[(d.getMonth()+1)+'-'+d.getDate()],yl=((new Date(d.getFullYear(),11,31))-(new Date(d.getFullYear(),0,0)))/864e5,n=doy(d);
  h+='<div class="day"><div class="dh'+(i===6||hol?' red':'')+(key(d)===tk?' today':'')+'"><span class="doy">'+n+'/'+(yl-n)+'</span><span class="n">'+d.getDate()+'</span><div class="w">'+DN[i]+'요일</div><input class="note" data-n="'+i+'" value="'+esc(W.n[i])+'" placeholder="'+(hol||'')+'" maxlength="16"></div>';
  for(var j=0;j<R;j++){var o=W.r[i][j];h+='<div class="row '+o.s+'"><button class="st" data-c="'+i+':'+j+'" aria-label="상태">'+(GLY[o.s]||'')+'</button><input class="lt" data-l="'+i+':'+j+'" value="'+esc(o.l)+'" maxlength="4"><input class="tx" data-t="'+i+':'+j+'" value="'+esc(o.t)+'"></div>'}
  h+='</div>'}
 h+='<div class="day"><div class="gh">Weekly Goals</div>';
 GL.forEach(function(g,i){h+='<div class="gr"><span>'+g+'</span><input data-g="'+i+'" value="'+esc(W.g[i])+'"></div>'});
 var y=th.getFullYear(),m=th.getMonth(),off=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),c=1;
 h+='<div class="cal"><b>'+['January','February','March','April','May','June','July','August','September','October','November','December'][m]+'</b><table><tr>'+['M','T','W','T','F','S','S'].map(function(x,q){return'<th class="'+(q>4?'we':'')+'">'+x+'</th>'}).join('')+'</tr>';
 for(var r=0;r<6&&c<=dim;r++){h+='<tr>';for(var q=0;q<7;q++){if((r===0&&q<off)||c>dim)h+='<td></td>';else{var dt=new Date(y,m,c);h+='<td class="'+(q>4?'we ':'')+(dt>=ws&&dt<=we?'in':'')+'">'+c+'</td>';c++}}h+='</tr>'}
 h+='</table></div></div></div>';
 app.innerHTML=h}
app.addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;
 if(t.dataset.nav!==undefined){var v=+t.dataset.nav;ws=v===0?mon(new Date()):add(ws,v*7);render();return}
 if(t.dataset.c){var p=t.dataset.c.split(':'),o=wk(key(ws)).r[+p[0]][+p[1]];o.s=ST[(ST.indexOf(o.s)+1)%ST.length];save();render()}});
app.addEventListener('input',function(e){var t=e.target,W=wk(key(ws)),p;
 if(t.dataset.t){p=t.dataset.t.split(':');W.r[+p[0]][+p[1]].t=t.value}
 else if(t.dataset.l){p=t.dataset.l.split(':');W.r[+p[0]][+p[1]].l=t.value}
 else if(t.dataset.n)W.n[+t.dataset.n]=t.value;
 else if(t.dataset.g)W.g[+t.dataset.g]=t.value;
 save()});
render();
})();
</script>
</body>
</html>
